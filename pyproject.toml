[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-brain-orchestrator"
version = "0.1.0"
description = "Orchestrator-Worker Multi-Agent Brain Cluster with Harness Control Layer and B1-Final Frozen Brain Kernel"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Multi-Agent Brain Orchestrator Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["agents*", "harness*", "brain_subsystem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true